name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_test_password
          POSTGRES_DB: booking_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run migrations (test db)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://booking:booking_test_password@localhost:5432/booking_platform_test

      - name: Test
        run: set -o pipefail && npm run test 2>&1 | tee /tmp/test-output.log
        env:
          DATABASE_URL: postgresql://booking:booking_test_password@localhost:5432/booking_platform_test
          REDIS_URL: redis://localhost:6379

      - name: On test failure, publish debug log as an Issue
        if: failure()
        run: |
          gh issue create \
            --title "CI failure: Test — run ${{ github.run_id }}" \
            --body-file /tmp/test-output.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: set -o pipefail && npm run build 2>&1 | tee /tmp/build-output.log

      - name: On build failure, publish debug log as an Issue
        if: failure()
        run: |
          if [ -f /tmp/build-output.log ]; then
            gh issue create \
              --title "CI failure: Build — run ${{ github.run_id }}" \
              --body-file /tmp/build-output.log
          else
            echo "No build-output.log (Build step was skipped) — nothing to publish"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test — boot server and hit real endpoints
        run: |
          set -e
          node apps/backend/dist/main.js &
          SERVER_PID=$!

          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/v1/auth/me -o /dev/null 2>/dev/null; then break; fi
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/auth/me | grep -q "401"; then break; fi
            sleep 1
          done

          echo "--- register/request-otp ---"
          OTP_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/auth/register/request-otp \
            -H "Content-Type: application/json" \
            -d '{"phone":"09121234567"}')
          echo "$OTP_RESPONSE"
          CODE=$(echo "$OTP_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.debugCode) { console.error('debugCode missing!'); process.exit(1); } console.log(j.debugCode); })")
          echo "OTP code extracted: $CODE"

          echo "--- register/verify ---"
          REGISTER_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/auth/register/verify \
            -H "Content-Type: application/json" \
            -d "{\"phone\":\"09121234567\",\"code\":\"$CODE\",\"fullName\":\"تست\",\"password\":\"Password1\"}")
          echo "$REGISTER_RESPONSE"
          ACCESS_TOKEN=$(echo "$REGISTER_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.accessToken) { console.error('accessToken missing!'); process.exit(1); } console.log(j.accessToken); })")

          echo "--- auth/me with access token ---"
          ME_RESPONSE=$(curl -s http://localhost:3001/api/v1/auth/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$ME_RESPONSE"
          echo "$ME_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (j.phone !== '09121234567') { console.error('phone mismatch!'); process.exit(1); } console.log('OK: /auth/me matches registered phone'); })"

          echo "--- auth/me without token must be rejected ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/auth/me)
          if [ "$STATUS" != "401" ]; then echo "expected 401, got $STATUS"; exit 1; fi
          echo "OK: unauthenticated request correctly rejected with 401"

          echo "--- create business (validates BusinessRoleGuard + transaction) ---"
          BUSINESS_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/businesses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"name":"آرایشگاه تست","category":"beauty"}')
          echo "$BUSINESS_RESPONSE"
          BUSINESS_ID=$(echo "$BUSINESS_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.id || j.status !== 'PENDING_REVIEW') { console.error('unexpected business response'); process.exit(1); } console.log(j.id); })")
          echo "Business created: $BUSINESS_ID"

          echo "--- owner can view their own business via BusinessRoleGuard ---"
          OWNER_VIEW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/businesses/$BUSINESS_ID -H "Authorization: Bearer $ACCESS_TOKEN")
          if [ "$OWNER_VIEW_STATUS" != "200" ]; then echo "expected 200, got $OWNER_VIEW_STATUS"; exit 1; fi
          echo "OK: owner can view their PENDING_REVIEW business"

          echo "--- unapproved business must NOT be publicly visible ---"
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/discover/businesses/$BUSINESS_ID)
          if [ "$PUBLIC_STATUS" != "404" ]; then echo "expected 404 for unapproved business, got $PUBLIC_STATUS"; exit 1; fi
          echo "OK: PENDING_REVIEW business correctly hidden from public discovery"

          echo "--- public discovery search must NOT be swallowed by /businesses/:id (routing collision check) ---"
          DISCOVER_SEARCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3001/api/v1/discover/businesses")
          if [ "$DISCOVER_SEARCH_STATUS" != "200" ]; then echo "expected 200, got $DISCOVER_SEARCH_STATUS"; exit 1; fi
          echo "OK: public discovery search route resolves correctly"

          echo "--- a random other user must NOT access this business ---"
          OTHER_OTP=$(curl -s -X POST http://localhost:3001/api/v1/auth/register/request-otp -H "Content-Type: application/json" -d '{"phone":"09129999999"}')
          OTHER_CODE=$(echo "$OTHER_OTP" | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).debugCode))")
          OTHER_REGISTER=$(curl -s -X POST http://localhost:3001/api/v1/auth/register/verify -H "Content-Type: application/json" -d "{\"phone\":\"09129999999\",\"code\":\"$OTHER_CODE\",\"fullName\":\"دیگری\",\"password\":\"Password1\"}")
          OTHER_TOKEN=$(echo "$OTHER_REGISTER" | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).accessToken))")
          FORBIDDEN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/businesses/$BUSINESS_ID -H "Authorization: Bearer $OTHER_TOKEN")
          if [ "$FORBIDDEN_STATUS" != "403" ]; then echo "expected 403, got $FORBIDDEN_STATUS"; exit 1; fi
          echo "OK: non-member correctly forbidden from another user's business (BusinessRoleGuard works)"

          echo "--- approve business directly in DB (no admin bootstrap endpoint exists yet) ---"
          PGPASSWORD=booking_test_password psql -h localhost -U booking -d booking_platform_test \
            -c "UPDATE \"Business\" SET status='APPROVED' WHERE id='$BUSINESS_ID';"

          echo "--- owner creates a branch ---"
          BRANCH_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/businesses/$BUSINESS_ID/branches \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"name":"شعبه مرکزی","address":"تهران، خیابان تست، پلاک ۱","latitude":35.7,"longitude":51.4}')
          echo "$BRANCH_RESPONSE"
          BRANCH_ID=$(echo "$BRANCH_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.id) { console.error('branch creation failed'); process.exit(1); } console.log(j.id); })")

          echo "--- owner creates a service (no deposit required) ---"
          SERVICE_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/businesses/$BUSINESS_ID/services \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"name":"کوتاهی مو","durationMinutes":30,"price":100000,"requiresDeposit":false}')
          echo "$SERVICE_RESPONSE"
          SERVICE_ID=$(echo "$SERVICE_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.id) { console.error('service creation failed'); process.exit(1); } console.log(j.id); })")

          echo "--- owner sets working hours for all 7 days (avoids date-dependent flakiness) ---"
          HOURS_JSON=$(node -e "console.log(JSON.stringify({branchId:'$BRANCH_ID', hours:[0,1,2,3,4,5,6].map(d=>({dayOfWeek:d,startTime:'00:00',endTime:'23:30'}))}))")
          WH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://localhost:3001/api/v1/businesses/$BUSINESS_ID/working-hours \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "$HOURS_JSON")
          if [ "$WH_STATUS" != "200" ] && [ "$WH_STATUS" != "201" ]; then echo "expected 200/201, got $WH_STATUS"; exit 1; fi
          echo "OK: working hours set"

          echo "--- check availability (public, no auth) ---"
          TOMORROW=$(date -u -d "+1 day" +%F)
          AVAIL_RESPONSE=$(curl -s "http://localhost:3001/api/v1/discover/availability/$BUSINESS_ID?serviceId=$SERVICE_ID&branchId=$BRANCH_ID&date=$TOMORROW")
          echo "$AVAIL_RESPONSE"
          SLOT_START=$(echo "$AVAIL_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!Array.isArray(j) || j.length === 0) { console.error('no free slots returned!'); process.exit(1); } console.log(j[0].startTime); })")
          echo "First free slot: $SLOT_START"

          echo "--- hold that slot (concurrency-safe reservation engine) ---"
          HOLD_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/bookings/hold \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "{\"businessId\":\"$BUSINESS_ID\",\"branchId\":\"$BRANCH_ID\",\"serviceId\":\"$SERVICE_ID\",\"startTime\":\"$SLOT_START\"}")
          echo "$HOLD_RESPONSE"
          BOOKING_ID=$(echo "$HOLD_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.id || j.status !== 'HOLD') { console.error('unexpected hold response'); process.exit(1); } console.log(j.id); })")
          echo "Booking held: $BOOKING_ID"

          echo "--- a different user trying to hold the EXACT SAME slot must be rejected (double-booking prevention) ---"
          CONFLICT_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/v1/bookings/hold \
            -H "Content-Type: application/json" -H "Authorization: Bearer $OTHER_TOKEN" \
            -d "{\"businessId\":\"$BUSINESS_ID\",\"branchId\":\"$BRANCH_ID\",\"serviceId\":\"$SERVICE_ID\",\"startTime\":\"$SLOT_START\"}")
          if [ "$CONFLICT_RESPONSE" != "409" ]; then echo "expected 409 for double-booking, got $CONFLICT_RESPONSE"; exit 1; fi
          echo "OK: concurrent hold on the same slot correctly rejected with 409 (no double-booking possible)"

          echo "--- confirm the booking (no deposit required -> should go straight to CONFIRMED) ---"
          CONFIRM_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/bookings/$BOOKING_ID/confirm \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$CONFIRM_RESPONSE"
          echo "$CONFIRM_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (j.status !== 'CONFIRMED') { console.error('expected CONFIRMED, got ' + j.status); process.exit(1); } console.log('OK: booking confirmed'); })"

          echo "--- booking appears in the user's booking list ---"
          MY_BOOKINGS=$(curl -s http://localhost:3001/api/v1/bookings/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$MY_BOOKINGS" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.some(b => b.id === '$BOOKING_ID')) { console.error('booking missing from /bookings/me'); process.exit(1); } console.log('OK: booking appears in /bookings/me'); })"

          echo "--- top up wallet (initiate -> simulate gateway callback -> verify balance) ---"
          TOPUP_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/wallet/topup \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"amount":200000}')
          echo "$TOPUP_RESPONSE"
          TOPUP_REF=$(echo "$TOPUP_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); const u = new URL(j.paymentUrl); const ref = u.searchParams.get('gatewayRefId'); if (!ref) { console.error('gatewayRefId missing from paymentUrl'); process.exit(1); } console.log(ref); })")
          CALLBACK_RESPONSE=$(curl -s "http://localhost:3001/api/v1/payments/callback/mock?gatewayRefId=$TOPUP_REF")
          echo "$CALLBACK_RESPONSE"
          echo "$CALLBACK_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (j.status !== 'SUCCESS') { console.error('topup callback did not succeed'); process.exit(1); } console.log('OK: topup callback verified'); })"
          WALLET_AFTER_TOPUP=$(curl -s http://localhost:3001/api/v1/wallet/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$WALLET_AFTER_TOPUP" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (Number(j.balance) !== 200000) { console.error('expected balance 200000, got ' + j.balance); process.exit(1); } console.log('OK: wallet balance is 200000 after topup'); })"

          echo "--- create a deposit-required service and book it ---"
          DEPOSIT_SERVICE_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/businesses/$BUSINESS_ID/services \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"name":"رنگ مو","durationMinutes":30,"price":500000,"requiresDeposit":true,"depositPercent":20}')
          echo "$DEPOSIT_SERVICE_RESPONSE"
          DEPOSIT_SERVICE_ID=$(echo "$DEPOSIT_SERVICE_RESPONSE" | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).id))")

          DEPOSIT_AVAIL=$(curl -s "http://localhost:3001/api/v1/discover/availability/$BUSINESS_ID?serviceId=$DEPOSIT_SERVICE_ID&branchId=$BRANCH_ID&date=$TOMORROW")
          DEPOSIT_SLOT=$(echo "$DEPOSIT_AVAIL" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (!j.length) { console.error('no slots for deposit service'); process.exit(1); } console.log(j[0].startTime); })")

          DEPOSIT_HOLD=$(curl -s -X POST http://localhost:3001/api/v1/bookings/hold \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "{\"businessId\":\"$BUSINESS_ID\",\"branchId\":\"$BRANCH_ID\",\"serviceId\":\"$DEPOSIT_SERVICE_ID\",\"startTime\":\"$DEPOSIT_SLOT\"}")
          DEPOSIT_BOOKING_ID=$(echo "$DEPOSIT_HOLD" | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).id))")

          DEPOSIT_CONFIRM=$(curl -s -X POST http://localhost:3001/api/v1/bookings/$DEPOSIT_BOOKING_ID/confirm -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$DEPOSIT_CONFIRM"
          echo "$DEPOSIT_CONFIRM" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (j.status !== 'PENDING') { console.error('expected PENDING (deposit required), got ' + j.status); process.exit(1); } console.log('OK: deposit-required booking correctly went to PENDING, not CONFIRMED'); })"

          echo "--- pay the deposit from wallet ---"
          PAY_RESPONSE=$(curl -s -X POST http://localhost:3001/api/v1/payments/initiate \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "{\"bookingId\":\"$DEPOSIT_BOOKING_ID\",\"method\":\"wallet\"}")
          echo "$PAY_RESPONSE"
          echo "$PAY_RESPONSE" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (j.paidFromWallet !== true) { console.error('expected wallet payment to succeed'); process.exit(1); } console.log('OK: deposit paid from wallet'); })"

          WALLET_AFTER_PAY=$(curl -s http://localhost:3001/api/v1/wallet/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$WALLET_AFTER_PAY" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); if (Number(j.balance) !== 100000) { console.error('expected balance 100000 after deposit payment, got ' + j.balance); process.exit(1); } console.log('OK: wallet balance correctly reduced to 100000 (200000 - 20% of 500000)'); })"

          FINAL_BOOKINGS=$(curl -s http://localhost:3001/api/v1/bookings/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$FINAL_BOOKINGS" | node -e "process.stdin.once('data', d => { const j = JSON.parse(d); const b = j.find(x => x.id === '$DEPOSIT_BOOKING_ID'); if (!b || b.status !== 'CONFIRMED') { console.error('expected deposit booking to be CONFIRMED after payment, got ' + (b && b.status)); process.exit(1); } console.log('OK: booking automatically CONFIRMED after successful deposit payment'); })"

          kill $SERVER_PID
        env:
          DATABASE_URL: postgresql://booking:booking_test_password@localhost:5432/booking_platform_test
          JWT_ACCESS_SECRET: ci-smoke-test-access-secret
          JWT_REFRESH_SECRET: ci-smoke-test-refresh-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 30d
          PORT: 3001
          CORS_ORIGIN: http://localhost:3000
          NODE_ENV: development
          OTP_DEBUG_EXPOSE: "true"
          REDIS_URL: redis://localhost:6379
